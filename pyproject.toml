[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsresolved"
version = "0.1.0"
description = "Watch the DNS records your hosts actually have: A, AAAA, CNAME, MX, TXT, NS over time with a local history. Built-in stdlib DNS client, no services."
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
whatsresolved = "whatsresolved:main"

[tool.setuptools]
py-modules = ["whatsresolved"]
